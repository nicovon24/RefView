<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="scene-assembly-3d-title scene-assembly-3d-desc" id="simulator-scene-hierarchy-root" font-family="Arial, system-ui, sans-serif">
<title id="scene-assembly-3d-title">Three.js scene hierarchy</title><desc id="scene-assembly-3d-desc">React Three Fiber mounts a Three.js scene with separate environment, seven player actors, referee, ball and camera branches. Canonical ticks provide transforms and motion samples.</desc>
<defs>
      <style>#simulator-scene-hierarchy-root { color: #2d2824; font-family: Arial,system-ui,sans-serif; }
      #simulator-scene-hierarchy-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#simulator-scene-hierarchy-root .diagram-container { overflow-x:visible }
}
      #simulator-scene-hierarchy-root text { fill:#2d2824; font-family:Arial,system-ui,sans-serif; }
      #simulator-scene-hierarchy-root .name { font-size:22px; font-weight:600; }
      #simulator-scene-hierarchy-root .sub { font-size:17px; fill:#62574f; }
      #simulator-scene-hierarchy-root .tag { font-size:14px; letter-spacing:.05em; fill:#62574f; }</style><style>
#scene-assembly-3d-root text { fill:#2d2824; font-family:Arial,system-ui,sans-serif; }
#scene-assembly-3d-root .name { font-size:22px; font-weight:600; }
#scene-assembly-3d-root .sub { font-size:17px; fill:#62574f; }
#scene-assembly-3d-root .tag { font-size:14px; letter-spacing:.05em; fill:#62574f; }
</style><marker id="simulator-scene-hierarchy-scene-assembly-3d-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#62574f"/></marker></defs>
<rect width="1280" height="720" fill="#f7f3ed"/><text x="48" y="72" class="name">Three.js scene hierarchy</text>
<path d="M 640 216 V 248" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#simulator-scene-hierarchy-scene-assembly-3d-arrow)"/><path d="M 640 336 V 368" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#simulator-scene-hierarchy-scene-assembly-3d-arrow)"/><path d="M 156 368 H 1124" fill="none" stroke="#62574f" stroke-width="1.5"/><path d="M 156 368 V 400" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#simulator-scene-hierarchy-scene-assembly-3d-arrow)"/><path d="M 398 368 V 400" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#simulator-scene-hierarchy-scene-assembly-3d-arrow)"/><path d="M 640 368 V 400" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#simulator-scene-hierarchy-scene-assembly-3d-arrow)"/><path d="M 882 368 V 400" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#simulator-scene-hierarchy-scene-assembly-3d-arrow)"/><path d="M 1124 368 V 400" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#simulator-scene-hierarchy-scene-assembly-3d-arrow)"/><g><rect x="472" y="112" width="336" height="104" rx="8" fill="#f3e0d5" stroke="#914024"/><text x="492" y="137" class="tag" fill="#914024">R3F MOUNT</text><text x="492" y="166" class="name">Canvas</text><text x="492" y="190" class="sub">React owns mount + lifecycle</text></g><g><rect x="472" y="248" width="336" height="88" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="492" y="273" class="tag" fill="#62574f">THREE RUNTIME</text><text x="492" y="302" class="name">THREE.Scene</text><text x="492" y="326" class="sub">Imperative scene objects</text></g><g><rect x="48" y="400" width="216" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="68" y="425" class="tag" fill="#62574f">ENVIRONMENT</text><text x="68" y="454" class="name">Field + stadium</text><text x="68" y="478" class="sub">Pitch, goals, crowd</text><text x="68" y="498" class="sub">Lighting + shadows</text></g><g><rect x="290" y="400" width="216" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="310" y="425" class="tag" fill="#62574f">ACTORS</text><text x="310" y="454" class="name">Players x7</text><text x="310" y="478" class="sub">Independent actor roots</text><text x="310" y="498" class="sub">Cloned skinned rigs</text></g><g><rect x="532" y="400" width="216" height="112" rx="8" fill="#f3e0d5" stroke="#914024"/><text x="552" y="425" class="tag" fill="#914024">CONTROLLED</text><text x="552" y="454" class="name">Referee</text><text x="552" y="478" class="sub">Canonical root + visual</text><text x="552" y="498" class="sub">Black kit, Idle / Walk / Jog</text></g><g><rect x="774" y="400" width="216" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="794" y="425" class="tag" fill="#62574f">TRACKED</text><text x="794" y="454" class="name">Ball</text><text x="794" y="478" class="sub">Own canonical transform</text><text x="794" y="498" class="sub">Authored event track</text></g><g><rect x="1016" y="400" width="216" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="1036" y="425" class="tag" fill="#62574f">VIEW</text><text x="1036" y="454" class="name">Camera</text><text x="1036" y="478" class="sub">First / third person</text><text x="1036" y="498" class="sub">Built from view sample</text></g><line x1="48" y1="640" x2="1232" y2="640" stroke="#d0bfb2"/><text x="48" y="669" class="sub">Each canonical tick updates actor roots, referee pose, ball and camera before rendering.</text><text x="48" y="693" class="sub">Detailed environment, player-rig and render-flow views are shown in companion diagrams.</text>
</svg>
