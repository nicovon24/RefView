<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="canonical-render-sequence-title canonical-render-sequence-desc" id="canonical-tick-render-sequence-root" font-family="Arial, system-ui, sans-serif">
<title id="canonical-render-sequence-title">Canonical tick to WebGL frame</title><desc id="canonical-render-sequence-desc">For every crossed canonical 60 hertz tick, the controller integrates referee view motion and distance, derives referee gait, freezes one render frame, and the exact scene applies actors, ball, referee and camera before WebGL rendering.</desc>
<defs>
      <style>#canonical-tick-render-sequence-root { color: #2d2824; font-family: Arial,system-ui,sans-serif; }
      #canonical-tick-render-sequence-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#canonical-tick-render-sequence-root .diagram-container { overflow-x:visible }
}
      #canonical-tick-render-sequence-root text { fill:#2d2824; font-family:Arial,system-ui,sans-serif; }
      #canonical-tick-render-sequence-root .name { font-size:22px; font-weight:600; }
      #canonical-tick-render-sequence-root .sub { font-size:17px; fill:#62574f; }
      #canonical-tick-render-sequence-root .tag { font-size:14px; letter-spacing:.05em; fill:#62574f; }</style><style>
#canonical-render-sequence-root text { fill:#2d2824; font-family:Arial,system-ui,sans-serif; }
#canonical-render-sequence-root .name { font-size:22px; font-weight:600; }
#canonical-render-sequence-root .sub { font-size:17px; fill:#62574f; }
#canonical-render-sequence-root .tag { font-size:14px; letter-spacing:.05em; fill:#62574f; }
</style><marker id="canonical-tick-render-sequence-canonical-render-sequence-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#62574f"/></marker></defs>
<rect width="1280" height="720" fill="#f7f3ed"/><text x="48" y="72" class="name">Canonical tick to WebGL frame</text>
<line x1="144" y1="196" x2="144" y2="596" stroke="#d0bfb2" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="392" y1="196" x2="392" y2="596" stroke="#d0bfb2" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="640" y1="196" x2="640" y2="596" stroke="#d0bfb2" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="888" y1="196" x2="888" y2="596" stroke="#d0bfb2" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="1136" y1="196" x2="1136" y2="596" stroke="#d0bfb2" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="388" y="224" width="8" height="384" fill="#f3e0d5" stroke="#914024" stroke-width="0.8"/><rect x="636" y="340" width="8" height="60" fill="#f3e0d5" stroke="#914024" stroke-width="0.8"/><rect x="884" y="460" width="8" height="128" fill="#f3e0d5" stroke="#914024" stroke-width="0.8"/><rect x="1132" y="520" width="8" height="68" fill="#f3e0d5" stroke="#914024" stroke-width="0.8"/><g><rect x="36" y="112" width="216" height="84" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="56" y="137" class="tag">TIMELINE</text><text x="56" y="166" class="name">Canonical world</text></g><g><rect x="284" y="112" width="216" height="84" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="304" y="137" class="tag">CONTROLLER</text><text x="304" y="166" class="name">Local controller</text></g><g><rect x="532" y="112" width="216" height="84" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="552" y="137" class="tag">LOCOMOTION</text><text x="552" y="166" class="name">Motion reducer</text></g><g><rect x="780" y="112" width="216" height="84" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="800" y="137" class="tag">EXACT SCENE</text><text x="800" y="166" class="name">Scene adapter</text></g><g><rect x="1028" y="112" width="216" height="84" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="1048" y="137" class="tag">THREE / WEBGL</text><text x="1048" y="166" class="name">Three + WebGL</text></g><path d="M 392 260 H 448 V 284 H 392" fill="none" stroke="#62574f" stroke-width="1.6" marker-end="url(#canonical-tick-render-sequence-canonical-render-sequence-arrow)"/><text x="492" y="276" class="sub" text-anchor="middle">integrate referee + camera</text><path d="M 144 240 H 392" fill="none" stroke="#62574f" stroke-width="1.6" marker-end="url(#canonical-tick-render-sequence-canonical-render-sequence-arrow)"/><text x="268.0" y="231" class="sub" text-anchor="middle">world state at tick t</text><path d="M 392 340 H 640" fill="none" stroke="#62574f" stroke-width="1.6" marker-end="url(#canonical-tick-render-sequence-canonical-render-sequence-arrow)"/><text x="516.0" y="331" class="sub" text-anchor="middle">distance + heading per crossed tick</text><path d="M 640 400 H 392" fill="none" stroke="#62574f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#canonical-tick-render-sequence-canonical-render-sequence-arrow)"/><text x="516.0" y="391" class="sub" text-anchor="middle">Idle / Walk / Jog + stride phase</text><path d="M 392 460 H 888" fill="none" stroke="#914024" stroke-width="1.6" marker-end="url(#canonical-tick-render-sequence-canonical-render-sequence-arrow)"/><text x="640.0" y="451" class="sub" text-anchor="middle">immutable LocalRenderFrame</text><path d="M 888 520 H 1136" fill="none" stroke="#62574f" stroke-width="1.6" marker-end="url(#canonical-tick-render-sequence-canonical-render-sequence-arrow)"/><text x="1012.0" y="511" class="sub" text-anchor="middle">apply actor roots + absolute pose</text><path d="M 888 576 H 1136" fill="none" stroke="#62574f" stroke-width="1.6" marker-end="url(#canonical-tick-render-sequence-canonical-render-sequence-arrow)"/><text x="1012.0" y="567" class="sub" text-anchor="middle">apply ball + referee + camera; render</text><line x1="48" y1="640" x2="1232" y2="640" stroke="#d0bfb2"/><text x="48" y="669" class="sub">Tick and pose do not depend on browser frame rate; direct sampling reproduces the same skeleton pose.</text><text x="48" y="693" class="sub">Animation and camera present the authored world; they do not alter incident facts or evaluation.</text>
</svg>
