">LOCAL / SERVER</text><text x="372" y="166" class="name">Compile + project</text><text x="372" y="190" class="sub">Validate and hash v2</text><text x="372" y="210" class="sub">Public / private views</text></g><g><rect x="656" y="112" width="248" height="112" rx="8" fill="#f3e0d5" stroke="#914024"/><text x="676" y="137" class="tag" fill="#914024">BROWSER</text><text x="676" y="166" class="name">3D simulator</text><text x="676" y="190" class="sub">Exact tick + cameras</text><text x="676" y="210" class="sub">Local route unsaved</text></g><g><rect x="960" y="112" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="980" y="137" class="tag" fill="#62574f">PLANNED WIRING</text><text x="980" y="166" class="name">Attempt operations</text><text x="980" y="190" class="sub">Owner-bound session</text><text x="980" y="210" class="sub">Decision + recovery</text></g><g><rect x="960" y="360" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="980" y="385" class="tag" fill="#62574f">DOMAIN</text><text x="980" y="414" class="name">Evaluation</text><text x="980" y="438" class="sub">Deterministic facts</text><text x="980" y="458" class="sub">No AI scoring</text></g><g><rect x="656" y="360" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="676" y="385" class="tag" fill="#62574f">SERVER / DB</text><text x="676" y="414" class="name">Prisma + Postgres</text><text x="676" y="438" class="sub">Versions and attempts</text><text x="676" y="458" class="sub">Integrated flow pending</text></g><g><rect x="352" y="360" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="372" y="385" class="tag" fill="#62574f">PLANNED WIRING</text><text x="372" y="414" class="name">Debrief + replay</text><text x="372" y="438" class="sub">Prepared explanation</text><text x="372" y="458" class="sub">Canonical timeline</text></g><g><rect x="48" y="360" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="68" y="385" class="tag" fill="#62574f">OPTIONAL</text><text x="68" y="414" class="name">AI Coach</text><text x="68" y="438" class="sub">Explain evaluated attempt</text><text x="68" y="458" class="sub">Cannot change score</text></g><line x1="48" y1="640" x2="1232" y2="640" stroke="#d0bfb2"/><text x="48" y="669" class="sub">Solid: intended main journey. Dashed: server-owned projection, restore or replay.</text><text x="48" y="693" class="sub">Current 3D routes are local, unsaved and unscored; reviewed publication and integrated attempts remain open.</text>
