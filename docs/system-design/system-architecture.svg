<title id="refview-architecture-title">RefView system architecture</title><desc id="refview-architecture-desc">Authored scenarios compile into public and private projections; the browser renders a canonical timeline, while owner-bound attempts, deterministic evaluation, persistence, debrief, replay and optional AI explanation form the planned integrated journey.</desc>
