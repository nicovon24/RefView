<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="rigged-pose-pipeline-title rigged-pose-pipeline-desc" id="rigged-pose-pipeline-root" font-family="Arial, system-ui, sans-serif">
<title id="rigged-pose-pipeline-title">How a canonical player pose is built</title><desc id="rigged-pose-pipeline-desc">Canonical actor tracks determine root and clip phase. A distance-driven gait plan supplies Idle, Walk and Jog weights; the sampler restores bind transforms, samples clips at exact times, applies contact or fall corrections, and submits the pose to the scene renderer.</desc>
<defs>
      <style>#rigged-pose-pipeline-root { color: #2d2824; font-family: Arial,system-ui,sans-serif; }
      #rigged-pose-pipeline-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#rigged-pose-pipeline-root .diagram-container { overflow-x:visible }
}
      #rigged-pose-pipeline-root text { fill:#2d2824; font-family:Arial,system-ui,sans-serif; }
      #rigged-pose-pipeline-root .name { font-size:22px; font-weight:600; }
      #rigged-pose-pipeline-root .sub { font-size:17px; fill:#62574f; }
      #rigged-pose-pipeline-root .tag { font-size:14px; letter-spacing:.05em; fill:#62574f; }</style><style>
#rigged-pose-pipeline-root text { fill:#2d2824; font-family:Arial,system-ui,sans-serif; }
#rigged-pose-pipeline-root .name { font-size:22px; font-weight:600; }
#rigged-pose-pipeline-root .sub { font-size:17px; fill:#62574f; }
#rigged-pose-pipeline-root .tag { font-size:14px; letter-spacing:.05em; fill:#62574f; }
</style><marker id="rigged-pose-pipeline-rigged-pose-pipeline-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#62574f"/></marker></defs>
<rect width="1280" height="720" fill="#f7f3ed"/><text x="48" y="72" class="name">How a canonical player pose is built</text>
<path d="M 296 224 H 352" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#rigged-pose-pipeline-rigged-pose-pipeline-arrow)"/><path d="M 600 224 H 656" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#rigged-pose-pipeline-rigged-pose-pipeline-arrow)"/><path d="M 904 224 H 960" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#rigged-pose-pipeline-rigged-pose-pipeline-arrow)"/><path d="M 1084 280 V 368" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#rigged-pose-pipeline-rigged-pose-pipeline-arrow)"/><path d="M 960 424 H 904" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#rigged-pose-pipeline-rigged-pose-pipeline-arrow)"/><path d="M 656 424 H 600" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#rigged-pose-pipeline-rigged-pose-pipeline-arrow)"/><g><rect x="48" y="168" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="68" y="193" class="tag" fill="#62574f">CANONICAL</text><text x="68" y="222" class="name">Actor track</text><text x="68" y="246" class="sub">Root position + yaw</text><text x="68" y="266" class="sub">Clip handle + phase</text></g><g><rect x="352" y="168" width="248" height="112" rx="8" fill="#f3e0d5" stroke="#914024"/><text x="372" y="193" class="tag" fill="#914024">DISTANCE-DRIVEN</text><text x="372" y="222" class="name">Build gait plan</text><text x="372" y="246" class="sub">Per-actor travel</text><text x="372" y="266" class="sub">Idle / Walk / Jog weights</text></g><g><rect x="656" y="168" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="676" y="193" class="tag" fill="#62574f">DETERMINISTIC</text><text x="676" y="222" class="name">Restore bind pose</text><text x="676" y="246" class="sub">Reset bones + root</text><text x="676" y="266" class="sub">Sample at canonical tick</text></g><g><rect x="960" y="168" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="980" y="193" class="tag" fill="#62574f">ANIMATION</text><text x="980" y="222" class="name">Blend clips</text><text x="980" y="246" class="sub">Stride phase + weights</text><text x="980" y="266" class="sub">Absolute clip times</text></g><g><rect x="960" y="368" width="248" height="112" rx="8" fill="#f3e0d5" stroke="#914024"/><text x="980" y="393" class="tag" fill="#914024">INCIDENT DETAIL</text><text x="980" y="422" class="name">Apply corrections</text><text x="980" y="446" class="sub">Contact IK + defender</text><text x="980" y="466" class="sub">Authored fall pose</text></g><g><rect x="656" y="368" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="676" y="393" class="tag" fill="#62574f">POSE OUTPUT</text><text x="676" y="422" class="name">Apply skeleton</text><text x="676" y="446" class="sub">Root + bone transforms</text><text x="676" y="466" class="sub">Player-specific instance</text></g><g><rect x="352" y="368" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="372" y="393" class="tag" fill="#62574f">PRESENTATION</text><text x="372" y="422" class="name">Exact scene render</text><text x="372" y="446" class="sub">Ball, referee, camera</text><text x="372" y="466" class="sub">WebGL frame</text></g><line x1="48" y1="640" x2="1232" y2="640" stroke="#d0bfb2"/><text x="48" y="669" class="sub">The same tick reconstructs the same actor root and skeleton pose, regardless of render frame rate.</text><text x="48" y="693" class="sub">Corrections change presentation only; authored contact, ball track and evaluation remain canonical.</text>
</svg>
