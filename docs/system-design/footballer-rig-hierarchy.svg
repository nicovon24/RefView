<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="footballer-rig-title footballer-rig-desc" id="footballer-rig-hierarchy-root" font-family="Arial, system-ui, sans-serif">
<title id="footballer-rig-title">Footballer rig and render hierarchy</title><desc id="footballer-rig-desc">Each player uses a cloned glTF group as its canonical actor root. Its skeleton branch contains pelvis, torso and limb bones; skinned body and generated kit shells are sibling surfaces bound to that skeleton.</desc>
<defs>
      <style>#footballer-rig-hierarchy-root { color: #2d2824; font-family: Arial,system-ui,sans-serif; }
      #footballer-rig-hierarchy-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#footballer-rig-hierarchy-root .diagram-container { overflow-x:visible }
}
      #footballer-rig-hierarchy-root text { fill:#2d2824; font-family:Arial,system-ui,sans-serif; }
      #footballer-rig-hierarchy-root .name { font-size:22px; font-weight:600; }
      #footballer-rig-hierarchy-root .sub { font-size:17px; fill:#62574f; }
      #footballer-rig-hierarchy-root .tag { font-size:14px; letter-spacing:.05em; fill:#62574f; }</style><style>
#footballer-rig-root text { fill:#2d2824; font-family:Arial,system-ui,sans-serif; }
#footballer-rig-root .name { font-size:22px; font-weight:600; }
#footballer-rig-root .sub { font-size:17px; fill:#62574f; }
#footballer-rig-root .tag { font-size:14px; letter-spacing:.05em; fill:#62574f; }
</style><marker id="footballer-rig-hierarchy-footballer-rig-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#62574f"/></marker></defs>
<rect width="1280" height="720" fill="#f7f3ed"/><text x="48" y="72" class="name">Footballer rig and render hierarchy</text>
<path d="M 640 192 V 220" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#footballer-rig-hierarchy-footballer-rig-arrow)"/><path d="M 432 220 H 848" fill="none" stroke="#62574f" stroke-width="1.5"/><path d="M 432 220 V 252" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#footballer-rig-hierarchy-footballer-rig-arrow)"/><path d="M 848 220 V 252" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#footballer-rig-hierarchy-footballer-rig-arrow)"/><path d="M 432 336 V 352" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#footballer-rig-hierarchy-footballer-rig-arrow)"/><path d="M 432 432 V 460" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#footballer-rig-hierarchy-footballer-rig-arrow)"/><path d="M 256 460 H 1024" fill="none" stroke="#62574f" stroke-width="1.5"/><path d="M 256 460 V 492" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#footballer-rig-hierarchy-footballer-rig-arrow)"/><path d="M 640 460 V 492" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#footballer-rig-hierarchy-footballer-rig-arrow)"/><path d="M 1024 460 V 492" fill="none" stroke="#62574f" stroke-width="1.5" marker-end="url(#footballer-rig-hierarchy-footballer-rig-arrow)"/><g><rect x="472" y="104" width="336" height="88" rx="8" fill="#f3e0d5" stroke="#914024"/><text x="492" y="129" class="tag" fill="#914024">PER ACTOR</text><text x="492" y="158" class="name">Actor root: THREE.Group</text><text x="492" y="182" class="sub">Cloned glTF group; canonical transform</text></g><g><rect x="300" y="252" width="264" height="84" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="320" y="277" class="tag" fill="#62574f">SKELETON</text><text x="320" y="306" class="name">Skeleton root</text><text x="320" y="330" class="sub">Independent bone hierarchy</text></g><g><rect x="716" y="252" width="264" height="84" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="736" y="277" class="tag" fill="#62574f">SKINNED SURFACES</text><text x="736" y="306" class="name">Body + kit shells</text><text x="736" y="330" class="sub">Generated shirt / shorts / boots</text></g><g><rect x="300" y="352" width="264" height="80" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="320" y="377" class="tag" fill="#62574f">BONE HIERARCHY</text><text x="320" y="406" class="name">Pelvis</text><text x="320" y="430" class="sub">Parent for torso + limbs</text></g><g><rect x="112" y="492" width="288" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="132" y="517" class="tag" fill="#62574f">TORSO CHAIN</text><text x="132" y="546" class="name">Torso + head</text><text x="132" y="570" class="sub">Spine, chest, neck</text><text x="132" y="590" class="sub">Head: eyes, brows + hair</text></g><g><rect x="496" y="492" width="288" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="516" y="517" class="tag" fill="#62574f">ARM CHAINS</text><text x="516" y="546" class="name">Left + right arms</text><text x="516" y="570" class="sub">Shoulder &gt; elbow &gt; wrist</text></g><g><rect x="880" y="492" width="288" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="900" y="517" class="tag" fill="#62574f">LEG CHAINS</text><text x="900" y="546" class="name">Left + right legs</text><text x="900" y="570" class="sub">Thigh &gt; calf &gt; foot &gt; toes</text></g><line x1="48" y1="640" x2="1232" y2="640" stroke="#d0bfb2"/><text x="48" y="669" class="sub">Each actor clones its skeleton and materials so pose and kit changes stay per player.</text><text x="48" y="693" class="sub">Shirt, shorts and boots are generated skinned shells over the source body mesh.</text>
</svg>
