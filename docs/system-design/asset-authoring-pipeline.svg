s="tag" fill="#62574f">REQUIRED GATE</text><text x="980" y="166" class="name">Asset validation</text><text x="980" y="190" class="sub">License + hash</text><text x="980" y="210" class="sub">Scale, clips, bounds</text></g><g><rect x="960" y="360" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="980" y="385" class="tag" fill="#62574f">CURRENT + PLANNED</text><text x="980" y="414" class="name">RefView authoring</text><text x="980" y="438" class="sub">Code now; visual editor</text><text x="980" y="458" class="sub">planned for placement</text></g><g><rect x="656" y="360" width="248" height="112" rx="8" fill="#f3e0d5" stroke="#914024"/><text x="676" y="385" class="tag" fill="#914024">DETERMINISTIC</text><text x="676" y="414" class="name">Compile + run</text><text x="676" y="438" class="sub">Source versions</text><text x="676" y="458" class="sub">Exact 60 Hz replay</text></g><g><rect x="352" y="360" width="248" height="112" rx="8" fill="#fffdf9" stroke="#62574f"/><text x="372" y="385" class="tag" fill="#62574f">OPEN GATE</text><text x="372" y="414" class="name">Review + publish</text><text x="372" y="438" class="sub">Contact readability</text><text x="372" y="458" class="sub">Evidence + build binding</text></g><line x1="48" y1="640" x2="1232" y2="640" stroke="#d0bfb2"/><text x="48" y="669" class="sub">Blender and the visual editor are proposed workflow additions; current authoring is code-based.</text><text x="48" y="693" class="sub">Current assets include glTF plus procedural modules; training publication is still open.</text>
