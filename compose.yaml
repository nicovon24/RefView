services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: refview
      POSTGRES_PASSWORD: refview_local
      POSTGRES_DB: refview
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refview -d refview"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - refview-postgres:/var/lib/postgresql/data

volumes:
  refview-postgres:
